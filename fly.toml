# fly.toml app configuration file generated for casamentoback-nlxrmw on 2026-06-19T15:47:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'casamentoback-nlxrmw'
primary_region = 'gru'

[build]
  dockerfile = 'dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://+:8080'
  MERCADOPAGO_ENVIRONMENT = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
